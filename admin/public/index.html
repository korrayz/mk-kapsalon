<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MK Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c9a15a'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='700' text-anchor='middle' fill='%231a1305'%3EMK%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <h1>MK <span>Kapsalon</span></h1>
      <p class="muted">Yönetim Paneli</p>
      <input type="password" id="loginPass" placeholder="Şifre" autocomplete="current-password" required />
      <button type="submit" class="btn btn-gold">Giriş</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">MK <span>Kapsalon</span><small>Yönetim</small></div>
      <nav>
        <button class="nav-btn active" data-tab="agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Ajanda</button>
        <button class="nav-btn" data-tab="slots">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Boş Saatler</button>
        <button class="nav-btn" data-tab="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          Müşteriler</button>
        <button class="nav-btn" data-tab="penalties">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 5.5A7.5 7.5 0 0 0 6.5 12 7.5 7.5 0 0 0 17 18.5M4 10h8M4 14h8"/></svg>
          Cezalar</button>
        <button class="nav-btn" data-tab="blacklist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>
          Kara Liste</button>
      </nav>
      <div class="side-stats" id="sideStats"></div>
      <button id="logoutBtn" class="btn btn-ghost small">Çıkış</button>
    </aside>

    <main class="main">

      <!-- AGENDA -->
      <section id="tab-agenda" class="tab active">
        <div class="toolbar">
          <div class="date-nav">
            <button class="btn btn-ghost" id="prevDay">‹</button>
            <input type="date" id="agendaDate" />
            <button class="btn btn-ghost" id="nextDay">›</button>
            <button class="btn btn-ghost" id="todayBtn">Bugün</button>
          </div>
          <select id="agendaBarber"><option value="">Tüm berberler</option></select>
          <select id="agendaStatus">
            <option value="">Tüm durumlar</option>
            <option value="scheduled">Bekliyor</option>
            <option value="completed">Tamamlandı</option>
            <option value="no_show">Gelmedi</option>
            <option value="cancelled">İptal</option>
          </select>
          <button class="btn btn-gold" id="newApptBtn">+ Yeni Randevu</button>
        </div>
        <div id="agendaList" class="appt-list"></div>
      </section>

      <!-- SLOTS -->
      <section id="tab-slots" class="tab">
        <div class="toolbar">
          <select id="slotBarber"></select>
          <select id="slotService"></select>
          <label class="inline">Gün: <input type="number" id="slotDays" value="14" min="1" max="60" /></label>
          <button class="btn btn-gold" id="findSlots">Boş saat bul</button>
        </div>
        <div id="earliestBox" class="earliest" hidden></div>
        <div id="slotResults" class="slot-results"></div>
      </section>

      <!-- CUSTOMERS -->
      <section id="tab-customers" class="tab">
        <div class="toolbar">
          <input type="search" id="custSearch" placeholder="İsim veya telefon ara…" />
          <button class="btn btn-gold" id="newCustBtn">+ Yeni Müşteri</button>
        </div>
        <div id="custList" class="table-wrap"></div>
      </section>

      <!-- PENALTIES -->
      <section id="tab-penalties" class="tab">
        <div class="toolbar">
          <select id="penStatus">
            <option value="open">Açık</option>
            <option value="paid">Ödendi</option>
            <option value="waived">Silindi</option>
            <option value="">Hepsi</option>
          </select>
          <div id="penTotal" class="pen-total"></div>
        </div>
        <div id="penList" class="table-wrap"></div>
      </section>

      <!-- BLACKLIST -->
      <section id="tab-blacklist" class="tab">
        <div class="toolbar">
          <p class="muted">Kara listedeki kişiye yeni randevu açılırken uyarı verilir.</p>
        </div>
        <div id="blackList" class="table-wrap"></div>
      </section>

    </main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
